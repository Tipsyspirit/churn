[theme]
base = "light"
primaryColor = "#F5EE50"
backgroundColor = "#F5F5F3"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14141A"
font = "sans serif"

[server]
port = 8501
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[runner]
fastReruns = true