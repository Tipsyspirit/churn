version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churnsight-backend
    ports: ["8000:8000"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      DATABASE_URL: sqlite:////app/data/users.db
      CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
      MODEL_PATH: /app/artifacts/customer_churn_model.joblib
    volumes:
      - backend_data:/app/data
      - ./backend/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: churnsight-streamlit
    ports: ["8501:8501"]
    environment:
      API_BASE: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data: